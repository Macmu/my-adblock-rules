name: Diagnose

on:
  workflow_dispatch:  # 手动触发

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 环境检查
        run: |
          echo "=== bash 版本 ==="
          bash --version | head -1
          echo "=== 当前目录 ==="
          pwd
          ls -la
          echo "=== 关键文件 ==="
          ls -la sources.txt scripts/merge.sh
          echo "=== sources.txt 原始内容（带行号）==="
          cat -n sources.txt
          echo "=== 命令可用性 ==="
          which curl sed awk grep sort

      - name: 逐条测试 URL 下载
        run: |
          echo "=== 测试 GitHub raw 连通性 ==="
          curl -sL --connect-timeout 10 --max-time 30 -o /dev/null -w "github_raw: %{http_code}\n" \
            https://raw.githubusercontent.com/adguardteam/AdGuardSDNSFilter/master/Filters/filter.txt || echo "github_raw 失败"
          
          echo "=== 测试 jsDelivr 连通性 ==="
          curl -sL --connect-timeout 10 --max-time 30 -o /dev/null -w "jsdelivr: %{http_code}\n" \
            https://cdn.jsdelivr.net/gh/adguardteam/AdGuardSDNSFilter@master/Filters/filter.txt || echo "jsdelivr 失败"

      - name: 逐条测试 sources.txt 里的 URL
        run: |
          while IFS= read -r line; do
            url=$(echo "$line" | tr -d '\r')
            [ -z "$url" ] && continue
            case "$url" in \#*) continue ;; esac
            code=$(curl -sL --connect-timeout 10 --max-time 30 -o /dev/null -w "%{http_code}" "$url" 2>/dev/null || echo "000")
            echo "$code  $url"
          done < sources.txt
