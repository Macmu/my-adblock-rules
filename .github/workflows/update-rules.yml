name: Update Rules

on:
  schedule:
    # 每天北京时间 6:00 = UTC 22:00
    - cron: '0 22 * * *'
  workflow_dispatch:  # 允许手动触发

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 运行合并脚本
        run: |
          chmod +x scripts/*.sh
          ./scripts/merge.sh

      - name: 提交并推送更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/merged.txt
          git diff --staged --quiet || git commit -m "chore: 自动更新规则 $(date -u '+%Y-%m-%d')"
          git push
