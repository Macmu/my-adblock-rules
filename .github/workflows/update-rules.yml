name: Update Rules

on:
  push:
    branches: [main, master]
    paths: [sources.txt, scripts/**]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: 合并规则
        run: |
          chmod +x scripts/merge.sh
          bash scripts/merge.sh

      - name: 提交
        if: success()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: 自动更新合并规则 [skip ci]"
          file_pattern: "dist/merged.txt"
